openapi: 3.1.0
info:
  title: Birthday Gifting API
  version: 1.0.0
  description: "REST API for the birthday gifting platform. All responses use the
    envelope `{ success, data }` or `{ success: false, code, message, errors?
    }`. Money is always an integer number of minor units with a currency code.
    Realtime events are delivered over Socket.IO at path `/realtime`."
servers:
  - url: http://172.20.10.3:4000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    SuccessEnvelope:
      type: object
      required:
        - success
        - data
      properties:
        success:
          const: true
        data: {}
        meta:
          type: object
    ErrorEnvelope:
      type: object
      required:
        - success
        - code
        - message
      properties:
        success:
          const: false
        code:
          type: string
          enum:
            - VALIDATION_ERROR
            - NOT_FOUND
            - INTERNAL_ERROR
            - RATE_LIMITED
            - CONFLICT
            - PAYLOAD_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - UNAUTHENTICATED
            - FORBIDDEN
            - INVALID_CREDENTIALS
            - EMAIL_ALREADY_REGISTERED
            - PHONE_ALREADY_REGISTERED
            - USERNAME_TAKEN
            - OTP_INVALID
            - OTP_EXPIRED
            - OTP_MAX_ATTEMPTS
            - TOKEN_EXPIRED
            - TOKEN_INVALID
            - TOKEN_REVOKED
            - ACCOUNT_SUSPENDED
            - ACCOUNT_NOT_VERIFIED
            - OAUTH_TOKEN_INVALID
            - PASSWORD_NOT_SET
            - FRIEND_REQUEST_EXISTS
            - ALREADY_FRIENDS
            - CANNOT_FRIEND_SELF
            - NOT_FRIENDS
            - USER_BLOCKED
            - BLOCKED_BY_USER
            - WISHLIST_PRIVATE
            - WISHLIST_ITEM_NOT_FOUND
            - GIFT_ALREADY_RESERVED
            - GIFT_NOT_RESERVED
            - NOT_RESERVATION_OWNER
            - CANNOT_RESERVE_OWN_ITEM
            - OWNER_CANNOT_VIEW_RESERVATIONS
            - ITEM_QUANTITY_EXHAUSTED
            - URL_UNFURL_FAILED
            - GROUP_GIFT_CLOSED
            - GROUP_GIFT_TARGET_EXCEEDED
            - NOT_GROUP_MEMBER
            - BIRTHDAY_PERSON_EXCLUDED
            - CONTRIBUTION_TOO_SMALL
            - PAYMENT_FAILED
            - PAYMENT_NOT_CONFIRMED
            - PAYMENT_PROVIDER_UNAVAILABLE
            - PAYMENT_ALREADY_SETTLED
            - INSUFFICIENT_WALLET_BALANCE
            - CURRENCY_MISMATCH
            - WEBHOOK_SIGNATURE_INVALID
            - DUPLICATE_REQUEST
            - RECIPIENT_NOT_ACCEPTING
            - PHYSICAL_GIFT_REQUIRES_CONNECTION
            - GLOBAL_CELEBRATION_NOT_ELIGIBLE
            - STRANGER_LIMIT_REACHED
            - NOT_BIRTHDAY_TODAY
            - PRODUCT_UNAVAILABLE
            - VENDOR_NOT_APPROVED
            - ORDER_NOT_CANCELLABLE
            - INVALID_DELIVERY_TRANSITION
            - COUPON_INVALID
            - COUPON_EXPIRED
            - COUPON_USAGE_EXCEEDED
            - EVENT_NOT_FOUND
            - NOT_EVENT_HOST
            - NOT_INVITED
            - AI_UNAVAILABLE
            - AI_QUOTA_EXCEEDED
            - UPLOAD_FAILED
            - FILE_TYPE_NOT_ALLOWED
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
        requestId:
          type: string
    ErrorStatusTable:
      description: HTTP status used for each error code
      type: object
      properties:
        VALIDATION_ERROR:
          const: 422
        NOT_FOUND:
          const: 404
        INTERNAL_ERROR:
          const: 500
        RATE_LIMITED:
          const: 429
        CONFLICT:
          const: 409
        PAYLOAD_TOO_LARGE:
          const: 413
        UNSUPPORTED_MEDIA_TYPE:
          const: 415
        UNAUTHENTICATED:
          const: 401
        FORBIDDEN:
          const: 403
        INVALID_CREDENTIALS:
          const: 401
        EMAIL_ALREADY_REGISTERED:
          const: 409
        PHONE_ALREADY_REGISTERED:
          const: 409
        USERNAME_TAKEN:
          const: 409
        OTP_INVALID:
          const: 400
        OTP_EXPIRED:
          const: 410
        OTP_MAX_ATTEMPTS:
          const: 429
        TOKEN_EXPIRED:
          const: 401
        TOKEN_INVALID:
          const: 401
        TOKEN_REVOKED:
          const: 401
        ACCOUNT_SUSPENDED:
          const: 403
        ACCOUNT_NOT_VERIFIED:
          const: 403
        OAUTH_TOKEN_INVALID:
          const: 401
        PASSWORD_NOT_SET:
          const: 400
        FRIEND_REQUEST_EXISTS:
          const: 409
        ALREADY_FRIENDS:
          const: 409
        CANNOT_FRIEND_SELF:
          const: 400
        NOT_FRIENDS:
          const: 403
        USER_BLOCKED:
          const: 403
        BLOCKED_BY_USER:
          const: 404
        WISHLIST_PRIVATE:
          const: 403
        WISHLIST_ITEM_NOT_FOUND:
          const: 404
        GIFT_ALREADY_RESERVED:
          const: 409
        GIFT_NOT_RESERVED:
          const: 409
        NOT_RESERVATION_OWNER:
          const: 403
        CANNOT_RESERVE_OWN_ITEM:
          const: 400
        OWNER_CANNOT_VIEW_RESERVATIONS:
          const: 403
        ITEM_QUANTITY_EXHAUSTED:
          const: 409
        URL_UNFURL_FAILED:
          const: 422
        GROUP_GIFT_CLOSED:
          const: 409
        GROUP_GIFT_TARGET_EXCEEDED:
          const: 409
        NOT_GROUP_MEMBER:
          const: 403
        BIRTHDAY_PERSON_EXCLUDED:
          const: 403
        CONTRIBUTION_TOO_SMALL:
          const: 400
        PAYMENT_FAILED:
          const: 402
        PAYMENT_NOT_CONFIRMED:
          const: 409
        PAYMENT_PROVIDER_UNAVAILABLE:
          const: 503
        PAYMENT_ALREADY_SETTLED:
          const: 409
        INSUFFICIENT_WALLET_BALANCE:
          const: 402
        CURRENCY_MISMATCH:
          const: 400
        WEBHOOK_SIGNATURE_INVALID:
          const: 401
        DUPLICATE_REQUEST:
          const: 409
        RECIPIENT_NOT_ACCEPTING:
          const: 403
        PHYSICAL_GIFT_REQUIRES_CONNECTION:
          const: 403
        GLOBAL_CELEBRATION_NOT_ELIGIBLE:
          const: 403
        STRANGER_LIMIT_REACHED:
          const: 429
        NOT_BIRTHDAY_TODAY:
          const: 409
        PRODUCT_UNAVAILABLE:
          const: 409
        VENDOR_NOT_APPROVED:
          const: 403
        ORDER_NOT_CANCELLABLE:
          const: 409
        INVALID_DELIVERY_TRANSITION:
          const: 409
        COUPON_INVALID:
          const: 400
        COUPON_EXPIRED:
          const: 410
        COUPON_USAGE_EXCEEDED:
          const: 409
        EVENT_NOT_FOUND:
          const: 404
        NOT_EVENT_HOST:
          const: 403
        NOT_INVITED:
          const: 403
        AI_UNAVAILABLE:
          const: 503
        AI_QUOTA_EXCEEDED:
          const: 429
        UPLOAD_FAILED:
          const: 500
        FILE_TYPE_NOT_ALLOWED:
          const: 415
paths:
  /api/v1/admin/stats:
    get:
      tags:
        - Admin
      summary: Dashboard statistics and daily series
      operationId: getAdminStats
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 7
            maximum: 365
            default: 30
        - name: currency
          in: query
          required: false
          schema:
            type: string
            enum:
              - KES
              - USD
              - EUR
              - GBP
              - UGX
              - TZS
              - NGN
              - ZAR
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/reports/engagement:
    get:
      tags:
        - Admin
      summary: Engagement, conversion and category report
      operationId: getAdminReportsEngagement
      parameters:
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 365
            default: 30
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/users:
    get:
      tags:
        - Admin
      summary: Search and filter users
      operationId: getAdminUsers
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: role
          in: query
          required: false
          schema:
            type: string
            enum:
              - USER
              - VENDOR
              - ADMIN
              - SUPER_ADMIN
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING_VERIFICATION
              - ACTIVE
              - SUSPENDED
              - DEACTIVATED
        - name: isPremium
          in: query
          required: false
          schema:
            type: boolean
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - NEWEST
              - OLDEST
              - LAST_ACTIVE
              - NAME
            default: NEWEST
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/users/{id}:
    get:
      tags:
        - Admin
      summary: User detail
      operationId: getAdminUsersId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]+$
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
    patch:
      tags:
        - Admin
      summary: Suspend, verify, change role or premium
      operationId: patchAdminUsersId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]+$
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - PENDING_VERIFICATION
                    - ACTIVE
                    - SUSPENDED
                    - DEACTIVATED
                role:
                  type: string
                  enum:
                    - USER
                    - VENDOR
                    - ADMIN
                    - SUPER_ADMIN
                isPremium:
                  type: boolean
                emailVerified:
                  type: boolean
                phoneVerified:
                  type: boolean
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
              additionalProperties: false
    delete:
      tags:
        - Admin
      summary: Delete a user account
      operationId: deleteAdminUsersId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]+$
      security:
        - bearerAuth: []
      responses:
        "204":
          description: No content
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
              additionalProperties: false
  /api/v1/admin/products:
    get:
      tags:
        - Admin
      summary: Products in any status
      operationId: getAdminProducts
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - DRAFT
              - PENDING_REVIEW
              - ACTIVE
              - OUT_OF_STOCK
              - REJECTED
              - ARCHIVED
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/products/{id}:
    patch:
      tags:
        - Admin
      summary: Approve, reject, archive or feature a product
      operationId: patchAdminProductsId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]+$
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - ACTIVE
                    - REJECTED
                    - ARCHIVED
                isFeatured:
                  type: boolean
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
              required:
                - status
              additionalProperties: false
  /api/v1/admin/vendors:
    get:
      tags:
        - Admin
      summary: Vendors with performance figures
      operationId: getAdminVendors
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - APPROVED
              - SUSPENDED
              - REJECTED
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/vendors/{id}:
    patch:
      tags:
        - Admin
      summary: Approve, suspend or reject a vendor; set commission
      operationId: patchAdminVendorsId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]+$
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - PENDING
                    - APPROVED
                    - SUSPENDED
                    - REJECTED
                commissionBps:
                  type: integer
                  minimum: 0
                  maximum: 5000
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
              required:
                - status
              additionalProperties: false
  /api/v1/admin/orders:
    get:
      tags:
        - Admin
      summary: Track orders
      operationId: getAdminOrders
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          schema:
            type: string
            minLength: 1
            maxLength: 120
        - name: status
          in: query
          required: false
          schema:
            type: string
            maxLength: 40
        - name: vendorId
          in: query
          required: false
          schema:
            type: string
            minLength: 8
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]+$
        - name: from
          in: query
          required: false
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: false
          schema:
            type: string
            format: date-time
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/orders/{id}:
    get:
      tags:
        - Admin
      summary: Order detail
      operationId: getAdminOrdersId
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]+$
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/orders/{id}/status:
    post:
      tags:
        - Admin
      summary: Move a paid order to processing, or cancel an unpaid one
      operationId: postAdminOrdersIdStatus
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]+$
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - PROCESSING
                    - CANCELLED
                reason:
                  type: string
                  maxLength: 500
                  nullable: true
              required:
                - status
              additionalProperties: false
  /api/v1/admin/orders/{id}/delivery:
    post:
      tags:
        - Admin
      summary: Update delivery status
      operationId: postAdminOrdersIdDelivery
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]+$
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - PENDING
                    - PROCESSING
                    - DISPATCHED
                    - OUT_FOR_DELIVERY
                    - DELIVERED
                    - FAILED
                    - RETURNED
                    - CANCELLED
                note:
                  type: string
                  maxLength: 500
                  nullable: true
                trackingCode:
                  type: string
                  maxLength: 64
                  nullable: true
                courier:
                  type: string
                  maxLength: 80
                  nullable: true
                occurredAt:
                  type: string
                  format: date-time
              required:
                - status
              additionalProperties: false
  /api/v1/admin/orders/{id}/refund:
    post:
      tags:
        - Admin
      summary: Refund an order (full or partial)
      operationId: postAdminOrdersIdRefund
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 64
            pattern: ^[A-Za-z0-9_-]+$
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amountMinor:
                  type: integer
                  minimum: 0
                  maximum: 1000000000000
                reason:
                  type: string
                  minLength: 3
                  maxLength: 500
              required:
                - reason
              additionalProperties: false
  /api/v1/admin/payments:
    get:
      tags:
        - Admin
      summary: Transactions
      operationId: getAdminPayments
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 256
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: q
          in: query
          required: false
          schema:
            type: string
            maxLength: 120
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum:
              - PENDING
              - SUCCESSFUL
              - FAILED
              - REFUNDED
              - CANCELLED
        - name: provider
          in: query
          required: false
          schema:
            type: string
            enum:
              - MPESA
              - CARD
              - STRIPE
              - PAYPAL
              - WALLET
              - MANUAL
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /api/v1/admin/payments/reconciliation:
    get:
      tags:
        - Admin
