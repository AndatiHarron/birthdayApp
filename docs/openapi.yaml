  /api/v1/auth/register:
    post:
      tags:
        - Auth
      summary: Register with email+password or phone
      description: Email signups get a session immediately plus a verification code.
        Phone-first signups return an OTP challenge; the account is created on
        verification.
      operationId: postAuthRegister
      parameters: []
      responses:
        "201":
          description: Success
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessEnvelope"
        default:
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  minLength: 3
                  maxLength: 254
                  format: email
                phone:
                  allOf:
                    - type: string
                    - type: string
                      pattern: ^\+[1-9]\d{7,14}$
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                displayName:
                  type: string
                  minLength: 1
                  maxLength: 60
                username:
                  type: string
                  minLength: 3
                  maxLength: 24
                  pattern: ^[a-z0-9._]+$
                birthday:
                  anyOf:
                    - type: object
                      properties:
                        month:
                          type: integer
                          minimum: 1
                          maximum: 12
                        day:
                          type: integer
                          minimum: 1
                          maximum: 31
                        year:
                          type: integer
                          minimum: 1900
                          maximum: 2026
                          nullable: true
                      required:
                        - month
                        - day
                      additionalProperties: false
                    - type: string
                      pattern: ^\d{4}-\d{2}-\d{2}$
                timezone:
                  type: string
                  minLength: 1
                  maxLength: 64
                inviteCode:
                  type: string
                  maxLength: 32
                acceptedTerms:
                  type: boolean
                  enum:
                    - true
                device:
                  type: object
                  properties:
                    deviceId:
                      type: string
                      minLength: 4
                      maxLength: 128
                    platform:
                      type: string
                      enum:
                        - ios
                        - android
                        - web
                    model:
                      type: string
                      maxLength: 64
                    osVersion:
                      type: string
                      maxLength: 32
                    appVersion:
                      type: string
                      maxLength: 32
                    pushToken:
                      type: string
                      maxLength: 256
                  additionalProperties: false
              required:
                - displayName
                - acceptedTerms
              additionalProperties: false
